name: Build Application and Make Release

on:
 workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "true"
          path: "ElysiumLauncher-source"
      - name: Download artifacts
        uses: actions/download-artifact@v7
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/ElysiumLauncher-source ElysiumLauncher-${{ env.VERSION }}
          mv ElysiumLauncher-Linux-Qt6-Portable*/ElysiumLauncher-portable.tar.gz ElysiumLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv ElysiumLauncher-Linux-aarch64-Qt6-Portable*/ElysiumLauncher-portable.tar.gz ElysiumLauncher-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv ElysiumLauncher-*.AppImage/ElysiumLauncher-*-x86_64.AppImage ElysiumLauncher-Linux-x86_64.AppImage
          mv ElysiumLauncher-*.AppImage.zsync/ElysiumLauncher-*-x86_64.AppImage.zsync ElysiumLauncher-Linux-x86_64.AppImage.zsync
          mv ElysiumLauncher-*.AppImage/ElysiumLauncher-*-aarch64.AppImage ElysiumLauncher-Linux-aarch64.AppImage
          mv ElysiumLauncher-*.AppImage.zsync/ElysiumLauncher-*-aarch64.AppImage.zsync ElysiumLauncher-Linux-aarch64.AppImage.zsync
          mv ElysiumLauncher-macOS*/ElysiumLauncher.zip ElysiumLauncher-macOS-${{ env.VERSION }}.zip

          tar --exclude='.git' -czf ElysiumLauncher-${{ env.VERSION }}.tar.gz ElysiumLauncher-${{ env.VERSION }}

          for d in ElysiumLauncher-Windows-MSVC*; do
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="ElysiumLauncher-Windows-MSVC"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv ElysiumLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in ElysiumLauncher-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="ElysiumLauncher-Windows-MinGW-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv ElysiumLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in ElysiumLauncher-Windows-MinGW-arm64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="ElysiumLauncher-Windows-MinGW-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv ElysiumLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: Elysium Launcher ${{ env.VERSION }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ElysiumLauncher-Linux-x86_64.AppImage
            ElysiumLauncher-Linux-x86_64.AppImage.zsync
            ElysiumLauncher-Linux-aarch64.AppImage
            ElysiumLauncher-Linux-aarch64.AppImage.zsync
            ElysiumLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
            ElysiumLauncher-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
            ElysiumLauncher-Windows-MinGW-w64-${{ env.VERSION }}.zip
            ElysiumLauncher-Windows-MinGW-w64-Portable-${{ env.VERSION }}.zip
            ElysiumLauncher-Windows-MinGW-w64-Setup-${{ env.VERSION }}.exe
            ElysiumLauncher-Windows-MinGW-arm64-${{ env.VERSION }}.zip
            ElysiumLauncher-Windows-MinGW-arm64-Portable-${{ env.VERSION }}.zip
            ElysiumLauncher-Windows-MinGW-arm64-Setup-${{ env.VERSION }}.exe
            ElysiumLauncher-Windows-MSVC-arm64-${{ env.VERSION }}.zip
            ElysiumLauncher-Windows-MSVC-arm64-Portable-${{ env.VERSION }}.zip
            ElysiumLauncher-Windows-MSVC-arm64-Setup-${{ env.VERSION }}.exe
            ElysiumLauncher-Windows-MSVC-${{ env.VERSION }}.zip
            ElysiumLauncher-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            ElysiumLauncher-Windows-MSVC-Setup-${{ env.VERSION }}.exe
            ElysiumLauncher-macOS-${{ env.VERSION }}.zip
            ElysiumLauncher-${{ env.VERSION }}.tar.gz
